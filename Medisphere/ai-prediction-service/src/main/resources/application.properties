spring.application.name=ai-prediction-service

server.port=8086

spring.data.mongodb.uri=mongodb://localhost:27017/aipredictiondb
spring.data.mongodb.database=aipredictiondb

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Python ML service configuration
python.ml.service.url=http://localhost:5000

# Other internal microservice endpoints
medisphere.patientservice.url=http://localhost:8081/patient
medisphere.healthtwinservice.url=http://localhost:8082/healthtwin
medisphere.vitalsservice.url=http://localhost:8083/vitals
