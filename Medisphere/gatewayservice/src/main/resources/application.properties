spring.application.name=gatewayservice

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/medisphere
# Patient Service
spring.cloud.gateway.server.webflux.routes[0].id=patient-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://patient-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/patient/**

# Health Twin Service
spring.cloud.gateway.server.webflux.routes[1].id=healthtwin-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://healthtwinservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/healthtwin/**

# Vitals Service
spring.cloud.gateway.server.webflux.routes[2].id=vitals-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://vitalsservice
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/vitals/**

# Consent Service
spring.cloud.gateway.server.webflux.routes[3].id=consent-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://consentservice
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/consent/**

# FHIR Service
spring.cloud.gateway.server.webflux.routes[4].id=fhir-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://fhirservice
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/fhir/**

# AI Prediction Service
spring.cloud.gateway.server.webflux.routes[5].id=ai-prediction-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://ai-prediction-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/**

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG